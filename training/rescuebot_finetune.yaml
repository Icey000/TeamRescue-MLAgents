behaviors:
  RescueBot:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 1.5e-4
      beta: 3.0e-3
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 20000
    keep_checkpoints: 5
    checkpoint_interval: 250000

# Fine-tune v3 on the full task only (two live cables).
environment_parameters:
  hazard_count: 2
