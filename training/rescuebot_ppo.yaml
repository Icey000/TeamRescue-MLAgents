behaviors:
  RescueBot:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 4000000
    time_horizon: 128
    summary_freq: 20000
    keep_checkpoints: 5
    checkpoint_interval: 250000

# Curriculum: learn fetch-and-deliver first, then add live cables one by one.
environment_parameters:
  hazard_count:
    curriculum:
      - name: NoHazards
        completion_criteria:
          measure: reward
          behavior: RescueBot
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 1.6
        value: 0
      - name: OneCable
        completion_criteria:
          measure: reward
          behavior: RescueBot
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 1.4
        value: 1
      - name: TwoCables
        value: 2

